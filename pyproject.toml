]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.5,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
