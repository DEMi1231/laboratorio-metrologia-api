<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratorio de Metrología | Panel</title>
  <style>
    :root { font-family: Inter, system-ui, Arial, sans-serif; color: #e9edf7; background: #0b1020; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .layout { max-width: 1150px; padding: 28px 18px; margin: auto; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
    .sub { color:#9aabc9; font-size:14px; }
    h1 { font-size:26px; margin:4px 0; }
    h2 { font-size:19px; margin: 0 0 15px; }
    .panel { background:#151d32; padding:22px; border:1px solid #2b3650; border-radius:14px; margin-bottom:16px; }
    .login { max-width: 460px; margin: 8vh auto; }
    label { display:block; margin:13px 0 6px; font-size:13px; color:#bfc9df; }
    input, textarea, select { width:100%; background:#0f1628; border:1px solid #394764; border-radius:9px; padding:11px 12px; color:#fff; font:inherit; }
    textarea { min-height: 170px; font-family: Consolas, monospace; font-size:13px; resize:vertical; }
    button { background:#5c8fff; color:#07132b; border:0; border-radius:9px; padding:11px 16px; font-weight:700; cursor:pointer; }
    button:hover { filter: brightness(1.13); }
    button.secondary, .tabs button { background:#27344e; color:#e9edf7; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .tabs button.active { background:#5c8fff; color:#07132b; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .row > * { flex:1; }
    .row button { flex:0 0 auto; }
    .muted { color:#9aabc9; }
    .msg { white-space:pre-wrap; margin-top:12px; font-size:14px; }
    .error { color:#ff9a9a; }
    .ok { color:#91e7b3; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #303b54; white-space:nowrap; }
    th { color:#b8c9ed; }
    .hidden { display:none !important; }
    code { color:#a9c7ff; }
  </style>
</head>
<body>
  <div class="layout">
    <section id="loginPanel" class="panel login">
      <h1>Laboratorio de Metrología</h1>
      <p class="sub">Inicia sesión para administrar el laboratorio.</p>
      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button style="margin-top:18px;width:100%" type="submit">Iniciar sesión</button>
      </form>
      <div id="loginMsg" class="msg" role="status"></div>
    </section>

    <main id="dashboard" class="hidden">
      <div class="top">
        <div><div class="sub">Panel de administración</div><h1>Laboratorio de Metrología</h1><div class="sub" id="who"></div></div>
        <button class="secondary" id="logout">Cerrar sesión</button>
      </div>
      <nav class="tabs" id="tabs" aria-label="Módulos"></nav>
      <div class="panel">
        <div class="row" style="margin-bottom:12px"><h2 id="moduleTitle" style="margin:0"></h2><button id="refresh" class="secondary">Actualizar lista</button></div>
        <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <p class="sub" id="empty"></p>
      </div>
      <div class="panel">
        <h2 id="createTitle">Registrar</h2>
        <p class="sub">Introduce los datos en formato JSON. Los identificadores deben existir en MySQL.</p>
        <form id="createForm">
          <label for="jsonData">Datos a enviar</label>
          <textarea id="jsonData" spellcheck="false" required></textarea>
          <button type="submit" style="margin-top:12px">Guardar registro</button>
        </form>
        <div id="actionMsg" class="msg" role="status"></div>
      </div>
    </main>
  </div>
  <script>
    // Se sirve desde el mismo FastAPI: no requiere configurar CORS.
    const API = '';
    const modules = [
      {name:'Clientes', path:'/clientes/', example:{nombre:'Empresa Ejemplo',correo:'cliente@ejemplo.com',telefono:'8112345678',direccion:'Monterrey'}},
      {name:'Equipos', path:'/equipos/', example:{cliente_id:1,nombre:'Multímetro Digital',marca:'Fluke',modelo:'87V',numero_serie:'EQ-001',intervalo:'0-1000 V'}},
      {name:'Órdenes', path:'/ordenes/', example:{cliente_id:1,fecha_recepcion:new Date().toISOString().slice(0,10)}},
      {name:'Metrólogos', path:'/metrologos/', example:{nombre:'Técnico Ejemplo',correo:'tecnico@ejemplo.com',activo:true}},
      {name:'Patrones', path:'/patrones/', example:{nombre:'Multímetro Patrón',numero_serie:'PAT-001',fecha_vencimiento:'2027-12-31',vigente:true}},
      {name:'Calibraciones', path:'/calibraciones/', example:{orden_id:1,equipo_id:1,metrologo_id:1,fecha_calibracion:new Date().toISOString().slice(0,10),temperatura:22.5,humedad:48,patrones_ids:[1],puntos:[{valor_nominal:100,lectura_patron:100,lectura_equipo:100.2,incertidumbre:0.05,emp:0.5}]}}
    ];
    let token = null;
    let active = 0;
    let user = null;
    const $ = id => document.getElementById(id);
    const errorText = e => e?.detail ? (typeof e.detail === 'string' ? e.detail : JSON.stringify(e.detail)) : 'Error desconocido';

    async function request(path, opts = {}) {
      const headers = {...(opts.headers || {})};
      if(token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(API + path, {...opts, headers});
      const text = await response.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = {detail:text}; }
      if(!response.ok) throw new Error(`${response.status}: ${errorText(data)}`);
      return data;
    }
    function message(el, text, good = false) {
      el.textContent = text;
      el.className = `msg ${good ? 'ok' : 'error'}`;
    }
    function reset() {
      token = null; user = null;
      $('loginPanel').classList.remove('hidden'); $('dashboard').classList.add('hidden');
      $('password').value = ''; $('loginMsg').textContent = '';
    }
    function renderTabs() {
      $('tabs').replaceChildren();
      modules.forEach((mod, i) => {
        const b = document.createElement('button'); b.textContent = mod.name;
        b.className = i === active ? 'active' : '';
        b.onclick = () => selectModule(i);
        $('tabs').appendChild(b);
      });
    }
    function selectModule(i) {
      active = i;
      const mod = modules[i];
      renderTabs();
      $('moduleTitle').textContent = mod.name;
      $('createTitle').textContent = `Registrar ${mod.name.toLowerCase()}`;
      $('jsonData').value = JSON.stringify(mod.example, null, 2);
      $('actionMsg').textContent = '';
      loadList();
    }
    function showTable(data) {
      const arr = Array.isArray(data) ? data : [];
      $('thead').replaceChildren(); $('tbody').replaceChildren();
      $('empty').textContent = arr.length ? '' : 'No hay registros para mostrar.';
      if(!arr.length) return;
      const columns = Object.keys(arr[0]);
      const trHead = document.createElement('tr');
      for(const col of columns) { const th = document.createElement('th'); th.textContent = col; trHead.appendChild(th); }
      $('thead').appendChild(trHead);
      for(const item of arr) {
        const tr = document.createElement('tr');
        for(const col of columns) {
          const td = document.createElement('td');
          const val = item[col];
          td.textContent = val != null && typeof val === 'object' ? JSON.stringify(val) : String(val ?? '');
          tr.appendChild(td);
        }
        $('tbody').appendChild(tr);
      }
    }
    async function loadList() {
      $('empty').textContent = 'Cargando...';
      try { showTable(await request(modules[active].path)); }
      catch(e) { $('thead').replaceChildren(); $('tbody').replaceChildren(); $('empty').textContent = ''; message($('actionMsg'), e.message); }
    }
    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      message($('loginMsg'), 'Iniciando sesión...', true);
      const form = new URLSearchParams({username:$('email').value,password:$('password').value});
      try {
        const result = await request('/auth/login', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form.toString()});
        token = result.access_token;
        user = await request('/auth/me');
        $('who').textContent = `${user.nombre} · ${user.rol}`;
        $('loginPanel').classList.add('hidden'); $('dashboard').classList.remove('hidden');
        selectModule(0);
      } catch(err) { token = null; message($('loginMsg'), err.message); }
    });
    $('createForm').addEventListener('submit', async e => {
      e.preventDefault();
      let payload;
      try { payload = JSON.parse($('jsonData').value); }
      catch { message($('actionMsg'), 'El contenido no es JSON válido.'); return; }
      try {
        const result = await request(modules[active].path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        message($('actionMsg'), `Registro creado con ID ${result.id ?? 'nuevo'}.`, true);
        await loadList();
      } catch(err) { message($('actionMsg'), err.message); }
    });
    $('refresh').onclick = loadList;
    $('logout').onclick = reset;
  </script>
</body>
</html>
